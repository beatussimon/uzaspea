x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: ./backend/.env
  environment:
    - DATABASE_URL=${DATABASE_URL}
    - REDIS_URL=${REDIS_URL}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  celery-worker:
    <<: *backend-common
    container_name: uzaspea-celery-worker
    restart: unless-stopped
    volumes:
      - ./persistent_data/media:/app/media
      - ./persistent_data/private_media:/app/private_media
      - ./persistent_data/vault_storage:/app/vault_storage
    command: celery -A uzachuo worker --loglevel=warning --concurrency=2 --max-tasks-per-child=50
    deploy:
      resources:
        limits:
          memory: 200M

  celery-beat:
    <<: *backend-common
    container_name: uzaspea-celery-beat
    restart: unless-stopped
    volumes:
      - ./persistent_data/media:/app/media
      - ./persistent_data/celerybeat:/app/celerybeat
    command: celery -A uzachuo beat --loglevel=warning --schedule /app/celerybeat/celerybeat-schedule
    deploy:
      resources:
        limits:
          memory: 80M

  db:
    image: postgres:15-alpine
    container_name: uzaspea-postgres
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${DB_NAME:-uzaspea}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=96MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=48MB"
      - "-c"
      - "effective_cache_size=220MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/var/lib/postgresql/ssl/server.crt"
      - "-c"
      - "ssl_key_file=/var/lib/postgresql/ssl/server.key"
    ports:
      - "${DATA_BIND_IP:-172.26.1.218}:5432:5432"
    volumes:
      - ./persistent_data/postgres:/var/lib/postgresql/data
      - ./certs/postgres:/var/lib/postgresql/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    image: redis:7-alpine
    container_name: uzaspea-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 80mb --maxmemory-policy volatile-lru --save ""
    ports:
      - "${DATA_BIND_IP:-172.26.1.218}:6379:6379"
    volumes:
      - ./persistent_data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96M
