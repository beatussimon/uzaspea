<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="SokoniMax - Buy and sell car parts, electronics, vehicles, and goods in Tanzania. Verified sellers, secure payments, and fast delivery." />
    <meta name="robots" content="index, follow" />
    <link rel="preconnect" href="https://pasifiq.store" />
    
    <!-- Open Graph Fallbacks -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SokoniMax" />
    <meta property="og:title" content="SokoniMax - Tanzania's Trusted Marketplace" />
    <meta property="og:description" content="Buy and sell car parts, electronics, vehicles, and goods in Tanzania. Verified sellers and secure payments." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter Card Fallbacks -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SokoniMax - Tanzania's Trusted Marketplace" />
    <meta name="twitter:description" content="Buy and sell car parts, electronics, vehicles, and goods in Tanzania." />
    <meta name="twitter:image" content="/logo.png" />

    <title>SokoniMax - Tanzania Marketplace</title>

    <!-- Synchronous Theme Pre-Activation (Prevents FOUC / White Flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && prefersDark);
          var root = document.documentElement;
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          var isHome = window.location.pathname === '/';

          if (isDark) {
            root.classList.add('dark');
            root.style.backgroundColor = '#000000';
            if (metaThemeColor) metaThemeColor.setAttribute('content', '#000000');
          } else {
            root.classList.remove('dark');
            root.style.backgroundColor = isHome ? '#000000' : '#ffffff';
            if (metaThemeColor) metaThemeColor.setAttribute('content', isHome ? '#000000' : '#ffffff');
          }

          if (isHome) {
            root.classList.add('is-home');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Instant Pre-Paint Shell Styling -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      html.dark, html.dark body {
        background-color: #000000 !important;
        color: #f3f4f6;
        color-scheme: dark;
      }
      html:not(.dark), html:not(.dark) body {
        background-color: #ffffff !important;
        color: #111827;
        color-scheme: light;
      }
      html.is-home, html.is-home body {
        background-color: #000000 !important;
      }

      /* Homepage-only instant navbar skeleton (pixel-perfect mobile & desktop) */
      #home-nav-skeleton {
        display: none;
      }
      html.is-home #home-nav-skeleton {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        pointer-events: none;
        padding-top: env(safe-area-inset-top, 0px);
      }

      .hnav-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 80rem; /* max-w-7xl */
        margin: 0 auto;
        height: 56px; /* h-14 */
        padding: 0 16px; /* px-4 */
        box-sizing: border-box;
      }
      @media (min-width: 640px) {
        .hnav-container {
          padding: 0 24px; /* sm:px-6 */
        }
      }
      @media (min-width: 768px) {
        .hnav-container {
          height: 80px; /* md:h-20 */
          padding: 0 32px; /* md:px-8 */
        }
      }

      .hnav-pulse {
        border-radius: 9999px;
        animation: hnav-pulse-anim 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        background-color: rgba(255, 255, 255, 0.09);
        flex-shrink: 0;
      }

      @keyframes hnav-pulse-anim {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.25; }
      }

      /* Left items: Hidden on mobile (<768px), matching Navbar.tsx hidden md:inline-flex */
      .hnav-left {
        display: none;
        align-items: center;
        gap: 14px;
        flex: 1;
        max-width: calc(50% - 80px);
      }
      @media (min-width: 768px) {
        .hnav-left {
          display: flex;
        }
      }

      .hnav-pill-sm {
        width: 52px;
        height: 24px;
      }

      /* Center Logo: Exact match for mobile h-14 (56px) and desktop md:h-16 (64px) */
      .hnav-center {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
      .hnav-logo {
        height: 56px; /* h-14 */
        width: auto;
        opacity: 0.95;
        display: block;
        object-fit: contain;
      }
      @media (min-width: 768px) {
        .hnav-logo {
          height: 64px; /* md:h-16 */
        }
      }

      /* Right items: 2 circular buttons on mobile, extra actions on desktop */
      .hnav-right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 4px; /* gap-1 on mobile */
        flex: 1;
        max-width: calc(50% - 80px);
        z-index: 10;
      }
      @media (min-width: 1024px) {
        .hnav-right {
          gap: 8px; /* gap-2 on lg */
          max-width: 380px;
        }
      }

      .hnav-circle {
        width: 36px;
        height: 36px;
      }

      .hnav-desktop-only {
        display: none;
      }
      @media (min-width: 1024px) {
        .hnav-desktop-only {
          display: block;
        }
      }

      .hnav-pill-btn {
        width: 68px;
        height: 32px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="home-nav-skeleton">
        <div class="hnav-container">
          <div class="hnav-left">
            <div class="hnav-pulse hnav-pill-sm"></div>
            <div class="hnav-pulse hnav-pill-sm"></div>
          </div>
          <div class="hnav-center">
            <img src="/logo_dark.png" alt="SokoniMax" class="hnav-logo" />
          </div>
          <div class="hnav-right">
            <!-- Mobile and desktop right action placeholders (Search & Notifications) -->
            <div class="hnav-pulse hnav-circle"></div>
            <div class="hnav-pulse hnav-circle"></div>
            <!-- Desktop only actions -->
            <div class="hnav-pulse hnav-circle hnav-desktop-only"></div>
            <div class="hnav-pulse hnav-circle hnav-desktop-only"></div>
            <div class="hnav-pulse hnav-pill-btn hnav-desktop-only"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
