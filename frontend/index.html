<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="SokoniMax - Buy and sell car parts, electronics, vehicles, and goods in Tanzania. Verified sellers, secure payments, and fast delivery." />
    <meta name="robots" content="index, follow" />
    <link rel="preconnect" href="https://pasifiq.store" />
    <link rel="preload" as="image" href="/logo_dark.png" type="image/png" />
    <link rel="preload" as="image" href="/kariakoo_nightscape.webp?v=3" type="image/webp" />
    
    <!-- Open Graph Fallbacks -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SokoniMax" />
    <meta property="og:title" content="SokoniMax - Tanzania's Trusted Marketplace" />
    <meta property="og:description" content="Buy and sell car parts, electronics, vehicles, and goods in Tanzania. Verified sellers and secure payments." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter Card Fallbacks -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SokoniMax - Tanzania's Trusted Marketplace" />
    <meta name="twitter:description" content="Buy and sell car parts, electronics, vehicles, and goods in Tanzania." />
    <meta name="twitter:image" content="/logo.png" />

    <title>SokoniMax - Tanzania Marketplace</title>

    <!-- Synchronous Theme Pre-Activation (Prevents FOUC / White Flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && prefersDark);
          var root = document.documentElement;
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          var isHome = window.location.pathname === '/';

          if (isDark) {
            root.classList.add('dark');
            root.style.backgroundColor = '#000000';
            if (metaThemeColor) metaThemeColor.setAttribute('content', '#000000');
          } else {
            root.classList.remove('dark');
            root.style.backgroundColor = isHome ? '#000000' : '#ffffff';
            if (metaThemeColor) metaThemeColor.setAttribute('content', isHome ? '#000000' : '#ffffff');
          }

          if (isHome) {
            root.classList.add('is-home');
            var lang = localStorage.getItem('uzaspea_language');
            if (lang === 'sw') {
              document.addEventListener('DOMContentLoaded', function() {
                var links = document.querySelectorAll('.hnav-link');
                if (links[0]) links[0].childNodes[0].nodeValue = 'Nyumbani ';
                if (links[1]) links[1].textContent = 'Bidhaa';
                if (links[2]) links[2].textContent = 'Msaada';
                var loginBtn = document.querySelector('.hnav-login-btn');
                if (loginBtn) loginBtn.textContent = 'Ingia';
              });
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- Instant Pre-Paint Shell Styling -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      html.dark, html.dark body {
        background-color: #000000 !important;
        color: #f3f4f6;
        color-scheme: dark;
      }
      html:not(.dark), html:not(.dark) body {
        background-color: #ffffff !important;
        color: #111827;
        color-scheme: light;
      }
      html.is-home, html.is-home body {
        background-color: #000000 !important;
      }

      /* Homepage-only instant navbar skeleton (pixel-perfect mobile & desktop) */
      #home-nav-skeleton {
        display: none;
      }
      html.is-home #home-nav-skeleton {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        pointer-events: none;
        padding-top: env(safe-area-inset-top, 0px);
      }

      .hnav-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 80rem; /* max-w-7xl */
        margin: 0 auto;
        height: 56px; /* h-14 */
        padding: 0 16px; /* px-4 */
        box-sizing: border-box;
      }
      @media (min-width: 640px) {
        .hnav-container {
          padding: 0 24px; /* sm:px-6 */
        }
      }
      @media (min-width: 768px) {
        .hnav-container {
          height: 80px; /* md:h-20 */
          padding: 0 32px; /* md:px-8 */
        }
      }

      .hnav-pulse {
        border-radius: 9999px;
        animation: hnav-pulse-anim 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        background-color: rgba(255, 255, 255, 0.09);
        flex-shrink: 0;
      }

      @keyframes hnav-pulse-anim {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.25; }
      }

      /* Left items: Real links with exact typography and spacing (zero glitch) */
      .hnav-left {
        display: none;
        align-items: center;
        gap: 14px;
        flex: 1;
        max-width: calc(50% - 80px);
        padding-left: 8px;
      }
      @media (min-width: 768px) {
        .hnav-left {
          display: flex;
          padding-left: 16px;
        }
      }
      @media (min-width: 1024px) {
        .hnav-left {
          gap: 20px;
          padding-left: 32px;
        }
      }

      .hnav-link {
        position: relative;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        font-size: 14px;
        font-weight: 600;
        line-height: 20px;
        color: rgba(255, 255, 255, 0.8);
        padding: 4px 0;
        white-space: nowrap;
        user-select: none;
      }
      .hnav-link.hnav-active {
        color: #ffffff;
      }
      .hnav-indicator {
        position: absolute;
        bottom: -4px;
        left: 0;
        right: 0;
        height: 2px;
        border-radius: 9999px;
        background-color: #ffffff;
      }

      /* Center Logo: Exact match for mobile h-14 (56px) and desktop md:h-16 (64px) */
      .hnav-center {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
      .hnav-logo {
        height: 56px; /* h-14 */
        width: auto;
        opacity: 0.95;
        display: block;
        object-fit: contain;
      }
      @media (min-width: 768px) {
        .hnav-logo {
          height: 64px; /* md:h-16 */
        }
      }

      /* Right items: Search, theme and clean Login button */
      .hnav-right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex: 1;
        max-width: calc(50% - 80px);
        z-index: 10;
      }
      @media (min-width: 1024px) {
        .hnav-right {
          max-width: 380px;
        }
      }

      .hnav-icon-btn {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        color: rgba(255, 255, 255, 0.85);
      }

      .hnav-desktop-only {
        display: none;
      }
      @media (min-width: 1024px) {
        .hnav-desktop-only {
          display: flex;
        }
      }

      .hnav-login-btn {
        display: none;
        align-items: center;
        justify-content: center;
        padding: 6px 20px;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        font-size: 14px;
        font-weight: 700;
        border-radius: 12px;
        background-color: #ffffff;
        color: #111827;
        line-height: 20px;
        white-space: nowrap;
      }
      @media (min-width: 1024px) {
        .hnav-login-btn {
          display: inline-flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="home-nav-skeleton">
        <div class="hnav-container">
          <div class="hnav-left">
            <span class="hnav-link hnav-active">
              Home
              <span class="hnav-indicator"></span>
            </span>
            <span class="hnav-link">Products</span>
            <span class="hnav-link">Help</span>
          </div>
          <div class="hnav-center">
            <img src="/logo_dark.png" alt="SokoniMax" class="hnav-logo" />
          </div>
          <div class="hnav-right">
            <div class="hnav-icon-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
            </div>
            <div class="hnav-icon-btn hnav-desktop-only">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
            </div>
            <div class="hnav-login-btn hnav-desktop-only">Login</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
