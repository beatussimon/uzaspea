server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ───────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/xhtml+xml font/woff2;

    # Proxy headers for upstream backend
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Serve user-uploaded media files directly (use ^~ to prevent regex override)
    location ^~ /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Pass robots.txt and sitemaps directly to backend
    location = /robots.txt {
        proxy_pass http://backend:8000/robots.txt;
    }

    location ~ ^/sitemap.*\.xml$ {
        proxy_pass http://backend:8000;
    }

    # FIX DEVOPS-11: Map all SPA routes back to index.html (or Django SEO renderer for bots)
    location / {
        set $is_bot 0;
        if ($http_user_agent ~* "googlebot|bingbot|yandex|baiduspider|facebookexternalhit|twitterbot|rogerbot|linkedinbot|embedly|quora link preview|showyoubot|outbrain|pinterest|slackbot|vkShare|W3C_Validator|whatsapp|telegrambot|applebot|duckduckbot") {
            set $is_bot 1;
        }

        # Static assets bypass bot checks
        if ($uri ~* "\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|json|txt)$") {
            set $is_bot 0;
        }

        if ($is_bot = 1) {
            proxy_pass http://backend:8000/api/seo/render/?path=$request_uri;
            break;
        }

        try_files $uri $uri/ /index.html;
    }

    # Do not cache the entry HTML file to guarantee instant updates
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # Hashed JS/CSS bundles — safe to cache forever (filename changes on rebuild)
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images — ETag smart cache: browser revalidates on every request.
    # 304 Not Modified = instant load if unchanged. New image = auto-fetched.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        etag on;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
