server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 50m;

    # ── Compression ───────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/xhtml+xml font/woff2;

    # ── Baseline Security Headers ─────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://pasifiq.store wss://pasifiq.store https://*.tile.openstreetmap.org https://nominatim.openstreetmap.org; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Proxy headers for upstream backend (including Cloudflare GeoIP!)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;

    # Block direct external access to internal Django auth endpoints
    location ^~ /internal/ {
        return 404;
    }

    # Authenticated / HMAC-Signed Private Media Gateway -> Django X-Accel-Redirect
    location ^~ /secure-media/ {
        proxy_pass http://backend:8000/internal/media-auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header Authorization $http_authorization;
    }

    # Authenticated Digital Vault Stream & Download Gateway -> Django X-Accel-Redirect (0MB Python RAM + Native Byte-Range!)
    location ^~ /api/digital/stream/ {
        proxy_pass http://backend:8000/api/digital/stream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    location ^~ /api/digital/download/ {
        proxy_pass http://backend:8000/api/digital/download/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }

    # Internal-only Private Media Storage (ONLY reachable via Django X-Accel-Redirect)
    location ^~ /_protected_media/ {
        internal;
        alias /app/private_media/;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Internal-only Digital Vault Storage (ONLY reachable via Django X-Accel-Redirect; supports PDF & Byte-Range Audio)
    location ^~ /_protected_vault/ {
        internal;
        alias /app/vault_storage/;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
        add_header Accept-Ranges "bytes" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Public Catalog Media (sandboxed against script execution)
    location ^~ /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /robots.txt {
        proxy_pass http://backend:8000/robots.txt;
    }

    location ~ ^/sitemap.*\.xml$ {
        proxy_pass http://backend:8000;
    }

    # Never cache Service Worker or entry HTML
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires -1;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://pasifiq.store wss://pasifiq.store https://*.tile.openstreetmap.org https://nominatim.openstreetmap.org; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        expires -1;
    }

    # Vite content-hashed assets — immutable 1-year cache
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Public static images/icons — 7-day cache with ETag
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        etag on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        add_header Vary "User-Agent" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://pasifiq.store wss://pasifiq.store https://*.tile.openstreetmap.org https://nominatim.openstreetmap.org; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

        set $is_bot 0;
        if ($http_user_agent ~* "googlebot|bingbot|yandex|baiduspider|facebookexternalhit|twitterbot|rogerbot|linkedinbot|embedly|quora link preview|showyoubot|outbrain|pinterest|slackbot|vkShare|W3C_Validator|whatsapp|telegrambot|applebot|duckduckbot") {
            set $is_bot 1;
        }

        if ($uri ~* "\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|json|txt|xml)$") {
            set $is_bot 0;
        }

        if ($is_bot = 1) {
            proxy_pass http://backend:8000/api/seo/render/?uri=$uri&args=$args;
            break;
        }

        try_files $uri $uri/ /index.html;
    }
}
